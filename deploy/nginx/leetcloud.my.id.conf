# /etc/nginx/sites-available/leetcloud.my.id — dipasang oleh deploy/release.sh.
# Cloudflare (proxied, SSL "Full (strict)") → nginx :443 (Cloudflare Origin Certificate leetcloud.my.id)
# → aplikasi yang sama (Next.js 127.0.0.1:3200, upstream portfolio_app dan zona limit_req
# didefinisikan di vhost ridhoreynaldo.com). Beranda "/" diarahkan ke /medan oleh next.config.

server {
    listen 80;
    listen [::]:80;
    server_name leetcloud.my.id www.leetcloud.my.id;
    return 301 https://leetcloud.my.id$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name leetcloud.my.id www.leetcloud.my.id;

    ssl_certificate     /etc/ssl/cloudflare/leetcloud.my.id.pem;
    ssl_certificate_key /etc/ssl/cloudflare/leetcloud.my.id.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # IP klien asli dari CF-Connecting-IP, hanya dipercaya dari rentang Cloudflare.
    include snippets/cloudflare-realip.conf;

    access_log /var/log/nginx/leetcloud.access.log;
    error_log  /var/log/nginx/leetcloud.error.log warn;

    # www → apex (satu URL kanonik)
    if ($host = www.leetcloud.my.id) { return 301 https://leetcloud.my.id$request_uri; }

    # Unggah QRIS / bukti bayar lewat server action: aplikasi membatasi 3 MB (bodySizeLimit 5 MB).
    client_max_body_size 6m;
    # Symlink rilis berganti saat deploy; jangan pakai file descriptor lama.
    open_file_cache off;
    limit_req_status 429;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location ~ /\.(?!well-known) {
        deny all;
    }

    # Login & pendaftaran: anti brute-force (aplikasi juga membatasi per IP+email)
    location ~ ^/medan/(login|register)$ {
        limit_req zone=portfolio_login burst=10 nodelay;
        proxy_pass http://portfolio_app;
    }

    # Aset build Next.js: nama berisi hash → cache setahun (browser & edge Cloudflare)
    location /_next/static/ {
        proxy_pass http://portfolio_app;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /api/health {
        access_log off;
        proxy_pass http://portfolio_app;
    }

    location / {
        limit_req zone=portfolio_public burst=60 nodelay;
        proxy_pass http://portfolio_app;
    }
}
