# /etc/nginx/sites-available/ridhoreynaldo.com — dipasang oleh deploy/release.sh.
# Cloudflare (proxied, SSL "Full (strict)") → nginx :443 (Cloudflare Origin Certificate, 15 th)
# → Next.js 127.0.0.1:3200. nginx.conf global & situs lain tidak diubah;
# nama zona/upstream diawali "portfolio_" karena bersifat global di server ini.

limit_req_zone $binary_remote_addr zone=portfolio_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=portfolio_public:10m rate=300r/m;

upstream portfolio_app {
    server 127.0.0.1:3200;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name ridhoreynaldo.com www.ridhoreynaldo.com;
    return 301 https://ridhoreynaldo.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ridhoreynaldo.com www.ridhoreynaldo.com;

    ssl_certificate     /etc/ssl/cloudflare/ridhoreynaldo.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/ridhoreynaldo.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # IP klien asli dari CF-Connecting-IP, hanya dipercaya dari rentang Cloudflare.
    include snippets/cloudflare-realip.conf;

    access_log /var/log/nginx/portfolio.access.log;
    error_log  /var/log/nginx/portfolio.error.log warn;

    # www → apex (satu URL kanonik)
    if ($host = www.ridhoreynaldo.com) { return 301 https://ridhoreynaldo.com$request_uri; }

    # Unggah QRIS / bukti bayar lewat server action: aplikasi membatasi 3 MB (bodySizeLimit 5 MB).
    client_max_body_size 6m;
    # Symlink rilis berganti saat deploy; jangan pakai file descriptor lama.
    open_file_cache off;
    limit_req_status 429;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location ~ /\.(?!well-known) {
        deny all;
    }

    # Login & pendaftaran: anti brute-force (aplikasi juga membatasi per IP+email)
    location ~ ^/(login|register)$ {
        limit_req zone=portfolio_login burst=10 nodelay;
        proxy_pass http://portfolio_app;
    }

    # Aset build Next.js: nama berisi hash → cache setahun (browser & edge Cloudflare)
    location /_next/static/ {
        proxy_pass http://portfolio_app;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /api/health {
        access_log off;
        proxy_pass http://portfolio_app;
    }

    location / {
        limit_req zone=portfolio_public burst=60 nodelay;
        proxy_pass http://portfolio_app;
    }
}
