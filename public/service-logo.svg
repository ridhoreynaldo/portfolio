<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Logo Kodeva">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1dc9e"/>
      <stop offset="1" stop-color="#b8923a"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f3561"/>
      <stop offset="1" stop-color="#0f1a33"/>
    </linearGradient>
  </defs>
  <!-- lempeng navy bersudut lembut dengan bingkai emas tipis -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#navy)"/>
  <rect x="3.25" y="3.25" width="57.5" height="57.5" rx="15" fill="none" stroke="url(#gold)" stroke-width="1.25" opacity="0.9"/>
  <!-- monogram K geometris: batang + dua lengan tegas -->
  <rect x="17" y="16" width="7.5" height="32" rx="1.5" fill="url(#gold)"/>
  <path d="M27.5 32 L45 16 h8.5 L36.6 32 L53.5 48 H45 Z" fill="url(#gold)"/>
  <!-- titik emas: node / koneksi -->
  <circle cx="20.75" cy="52.5" r="2.4" fill="url(#gold)"/>
</svg>
